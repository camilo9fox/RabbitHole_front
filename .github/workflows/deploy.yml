name: Build & Deploy Frontend

on:
  push:
    branches: [develop] # despliega cada push a develop
  workflow_dispatch: # permite dispararlo manualmente

env:
  IMAGE_NAME: front-ecommerce

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Opcional, acelera builds con cache
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AZURE_AD_B2C_TENANT_NAME: ${{ secrets.AZURE_AD_B2C_TENANT_NAME }}
          AZURE_AD_B2C_CLIENT_ID: ${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
          AZURE_AD_B2C_CLIENT_SECRET: ${{ secrets.AZURE_AD_B2C_CLIENT_SECRET }}
          AZURE_AD_B2C_PRIMARY_USER_FLOW: ${{ secrets.AZURE_AD_B2C_PRIMARY_USER_FLOW }}
          AZURE_AD_B2C_SIGNUP_USER_FLOW: ${{ secrets.AZURE_AD_B2C_SIGNUP_USER_FLOW }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # 1) actualizar env file
            cat > ~/front.env <<EOF
            AZURE_AD_B2C_TENANT_NAME=${{ secrets.AZURE_AD_B2C_TENANT_NAME }}
            AZURE_AD_B2C_CLIENT_ID=${{ secrets.AZURE_AD_B2C_CLIENT_ID }}
            AZURE_AD_B2C_CLIENT_SECRET=${{ secrets.AZURE_AD_B2C_CLIENT_SECRET }}
            AZURE_AD_B2C_PRIMARY_USER_FLOW=${{ secrets.AZURE_AD_B2C_PRIMARY_USER_FLOW }}
            AZURE_AD_B2C_SIGNUP_USER_FLOW=${{ secrets.AZURE_AD_B2C_SIGNUP_USER_FLOW }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            EOF
            chmod 600 ~/front.env

            # 2) login & pull
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # 3) recreate container
            docker stop front || true && docker rm front || true
            docker run -d --name front \
              -p 127.0.0.1:3000:3000 \
              --restart=always \
              --env-file ~/front.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # 4) reload nginx to pick up new container or renewed certificates
            sudo systemctl reload nginx
